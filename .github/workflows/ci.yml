name: Go API checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dispatch
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: dispatch
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U dispatch" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://dispatch:ci-only@localhost:5432/dispatch?sslmode=disable
      REQUIRE_INTEGRATION: "1"
      PGPASSWORD: ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
      - run: psql -h localhost -U dispatch -d dispatch -v ON_ERROR_STOP=1 -f migrations/001_events.sql
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build -o /tmp/dispatch-api ./cmd/api
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install openapi-spec-validator==0.9.0
      - run: python -m openapi_spec_validator api/openapi.json
