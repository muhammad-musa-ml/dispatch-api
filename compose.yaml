name: dispatch-api
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: dispatch
    volumes:
      - dispatch-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatch -d dispatch"]
      interval: 2s
      timeout: 3s
      retries: 20
  api:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://dispatch:local-development-only@db:5432/dispatch?sslmode=disable
      API_KEYS: '{"local-demo-key-alpha-000001":"alpha","local-demo-key-bravo-000002":"bravo"}'
      DELIVERY_TARGETS: '{"alpha":{"url":"http://receiver:8081/webhook","secret":"local-demo-signing-secret-00000001"},"bravo":{"url":"http://receiver:8081/webhook","secret":"local-demo-signing-secret-00000001"}}'
      ALLOW_HTTP_TARGETS: "1"
    depends_on:
      db:
        condition: service_healthy
      receiver:
        condition: service_started
  receiver:
    build: .
    entrypoint: ["/receiver"]
    environment:
      WEBHOOK_SECRET: local-demo-signing-secret-00000001
  test:
    image: golang:1.26-bookworm
    profiles: ["test"]
    working_dir: /src
    volumes:
      - .:/src
      - go-cache:/go
    environment:
      TEST_DATABASE_URL: postgres://dispatch:local-test-only@db-test:5432/dispatch?sslmode=disable
      REQUIRE_INTEGRATION: "1"
    command: ["go", "test", "-race", "-count=1", "./..."]
    depends_on:
      db-test:
        condition: service_healthy
  db-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: dispatch
    tmpfs: [/var/lib/postgresql/data]
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatch -d dispatch"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  dispatch-data:
  go-cache:
